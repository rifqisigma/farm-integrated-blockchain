info:
  contact:
    email: ipb_rifqi@apps.ipb.ac.id
    name: Project Menager
  description: This is a Backend for Agricultural of Distribution for reach transparant,
    decentralization, and immutable.
  termsOfService: http://swagger.io/terms/
  title: Agrichain - Distribution API
  version: "1.0"
paths:
  /auth/access-token:
    post:
      consumes:
      - application/json
      description: This endpoint to get new access token, you must have a valid refresh
        token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseAccessToken'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - BearerAuth: []
      summary: Create new access token.
      tags:
      - Auth
  /auth/delete-account:
    delete:
      consumes:
      - application/json
      description: This endpoint for delete user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - BearerAuth: []
      summary: Delete Account.
      tags:
      - Auth
  /auth/gmail/forgot-password:
    post:
      consumes:
      - js/ @Produce json
      description: This endpoint for user request send link reset password at email.
      parameters:
      - description: query email
        in: query
        name: email
        required: true
        type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      summary: Requset reset password.
      tags:
      - Auth
  /auth/gmail/login:
    post:
      consumes:
      - application/json
      description: This endpoint for user login, get the access and refresh token.
      parameters:
      - description: Login Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseLogin'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      summary: Login user
      tags:
      - Auth
  /auth/gmail/register:
    post:
      consumes:
      - application/json
      description: This endpoint for registery new user.
      parameters:
      - description: Register Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      summary: Register for new user
      tags:
      - Auth
  /auth/gmail/resend-verification:
    post:
      consumes:
      - js/ @Produce json
      description: This endpoint for user request resend link reset password in email
        if the user is late in verifying the account.
      parameters:
      - description: query email
        in: query
        name: email
        required: true
        type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      summary: Reset Password.
      tags:
      - Auth
  /auth/gmail/reset-password:
    post:
      consumes:
      - js/ @Produce json
      description: This endpoint for user request send only link reset password at
        email (i cant make ui for reset password form).
      parameters:
      - description: Reset password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UserResetPasswordRequest'
      - description: token
        in: query
        name: token
        required: true
        type: string
      - description: email
        in: query
        name: email
        required: true
        type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      summary: Reset Password.
      tags:
      - Auth
  /auth/gmail/verification:
    get:
      consumes:
      - application/json
      description: This endpoint will send on your email and for validating user.
      parameters:
      - description: Token validasi user
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      summary: Validation User.
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: This endpoint for Logout.
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - BearerAuth: []
      summary: Logout.
      tags:
      - Auth
  /auth/refresh-token:
    post:
      consumes:
      - application/json
      description: This endpoint for get new refresh token, for get new Refresh token
        you must have  a valid refresh token .
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseRefreshToken'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - BearerAuth: []
      summary: New Refresh Token.
      tags:
      - Auth
  /blockchain/distribution:
    get:
      consumes:
      - application/json
      description: This endpoint for get all distribution from blockchain API.
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - BearerAuth: []
      summary: Get all distribution.
      tags:
      - Blockchain
  /blockchain/distribution/{distribution}:
    get:
      consumes:
      - application/json
      description: This endpoint for get distribution from blockchain API by Id.
      parameters:
      - description: distribution id
        in: path
        name: distribution
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - BearerAuth: []
      summary: Get harvest processor by id.
      tags:
      - Blockchain
  /blockchain/harvest:
    get:

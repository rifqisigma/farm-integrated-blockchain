definitions:
  dto.AcceptFarmerForDistributor:
    properties:
      accepted:
        example: true
        type: boolean
    required:
    - accepted
    type: object
  dto.ApprovedRetailerCart:
    properties:
      approved:
        example: true
        type: boolean
    required:
    - approved
    type: object
  dto.Country:
    properties:
      name:
        example: Indonesia
        type: string
      region:
        $ref: '#/definitions/dto.Region'
    type: object
  dto.CountryRequest:
    properties:
      name:
        example: Indonesia
        type: string
      region:
        $ref: '#/definitions/dto.RegionRequest'
    required:
    - name
    - region
    type: object
  dto.CreateDistributionRequest:
    properties:
      final_price:
        example: 220
        type: number
      markup_price:
        example: 20
        type: number
      quantity:
        example: 200.5
        type: number
    required:
    - final_price
    - markup_price
    - quantity
    type: object
  dto.CreateProfileRequest:
    properties:
      name:
        type: string
      role:
        allOf:
        - $ref: '#/definitions/entity.Status'
        enum:
        - consumer
        - farmer
        - distributor
        - retailer
    required:
    - name
    - role
    type: object
  dto.CreateRetailerCartRequest:
    properties:
      quantity:
        example: 600.5
        type: number
    required:
    - quantity
    type: object
  dto.GetDistribution:
    properties:
      crop_name:
        type: string
      distributor_name:
        type: string
      farmer_name:
        type: string
      final_price:
        type: number
      id:
        type: integer
      regency_name:
        example: Bogor
        type: string
      time:
        type: string
    type: object
  dto.GetHarvestById:
    properties:
      accepted:
        example: true
        type: boolean
      base_price:
        example: 100000000
        type: number
      crop_name:
        example: Corn
        type: string
      farmer_name:
        example: Wayulo
        type: string
      id:
        example: 192
        type: integer
      quantity:
        example: 100
        type: number
      regency_name:
        example: Bogor
        type: string
      time:
        example: "2025-10-09T15:04:05Z"
        type: string
    type: object
  dto.GetListHarvest:
    properties:
      base_price:
        example: 100000000
        type: number
      country:
        $ref: '#/definitions/dto.Country'
      crop_name:
        example: rice
        type: string
      farmer_name:
        example: Kartosuryo
        type: string
      id:
        example: 1
        type: integer
      regency_name:
        example: Bogor
        type: string
      time:
        example: "2025-10-09T15:04:05Z"
        type: string
    type: object
  dto.GetRetailerCart:
    properties:
      distributor_name:
        example: Gopher
        type: string
      harvest_name:
        example: ""
        type: string
      id:
        type: integer
      quantity:
        example: 35.32
        type: number
      retailer_name:
        example: Siti
        type: string
      time:
        example: "2025-10-09T15:04:05Z"
        type: string
    type: object
  dto.GetUser:
    properties:
      data: {}
      email:
        type: string
      id:
        type: integer
      is_verified:
        type: string
      provider:
        type: string
      role:
        $ref: '#/definitions/entity.Status'
    type: object
  dto.HarvestRequest:
    properties:
      basePrice:
        example: 200000000
        type: number
      country:
        $ref: '#/definitions/dto.CountryRequest'
      name:
        example: Jagung ke-1
        type: string
      quantity:
        example: 100
        type: number
    required:
    - basePrice
    - country
    - name
    - quantity
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: rajaSukasari@gmail.com
        type: string
      password:
        example: "12345678"
        type: string
    required:
    - email
    - password
    type: object
  dto.NewRole:
    properties:
      name:
        type: string
      role:
        $ref: '#/definitions/entity.Status'
    type: object
  dto.Regency:
    properties:
      name:
        example: Bogor
        type: string
    type: object
  dto.RegencyRequest:
    properties:
      name:
        example: Bogor
        type: string
    required:
    - name
    type: object
  dto.Region:
    properties:
      name:
        example: Jawa Barat
        type: string
      regency:
        $ref: '#/definitions/dto.Regency'
    type: object
  dto.RegionRequest:
    properties:
      name:
        example: Jawa Barat
        type: string
      regency:
        $ref: '#/definitions/dto.RegencyRequest'
    required:
    - name
    - regency
    type: object
  dto.RegisterRequest:
    properties:
      email:
        example: rajaSukasari@gmail.com
        type: string
      name:
        example: name
        type: string
      password:
        example: "1234567"
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.ResponseAccessToken:
    properties:
      token_token:
        example: this is access token
        type: string
    type: object
  dto.ResponseError:
    properties:
      error:
        example: this is error
        type: string
    type: object
  dto.ResponseLogin:
    properties:
      access_token:
        example: this is access token
        type: string
      refresh_token:
        example: this is refresh token
        type: string
    type: object
  dto.ResponseRefreshToken:
    properties:
      refresh_token:
        example: this is refresh token
        type: string
    type: object
  dto.UpdateDistributionRequest:
    properties:
      final_price:
        example: 350
        type: number
      markup_price:
        example: 50
        type: number
      quantity:
        example: 20.7
        type: number
    type: object
  dto.UpdateProfileRequest:
    properties:
      name:
        type: string
      role:
        allOf:
        - $ref: '#/definitions/entity.Status'
        enum:
        - consumer
        - farmer
        - distributor
        - retailer
    required:
    - name
    - role
    type: object
  dto.UpdateRetailerCartRequest:
    properties:
      quantity:
        example: 34
        type: number
    required:
    - quantity
    type: object
  dto.UpdateRoleRequest:
    properties:
      new_role:
        $ref: '#/definitions/dto.NewRole'
    type: object
  dto.UpdateStatusDistributionRequest:
    properties:
      status:
        example: 7
        type: integer
    type: object
  dto.UserChangePasswordRequest:
    properties:
      confirm_new_password:
        type: string
      new_password:
        type: string
    required:
    - confirm_new_password
    - new_password
    type: object
  dto.UserResetPasswordRequest:
    properties:
      confirm_new_password:
        example: "7654321"
        type: string
      new_password:
        example: "7654321"
        type: string
    required:
    - confirm_new_password
    - new_password
    type: object
  entity.Status:
    enum:
    - consumer
    - farmer
    - distributor
    - retailer
    - admin
    type: string
    x-enum-varnames:
    - Consumer
    - Farmer
    - Distributor
    - Retailer
    - Admin
info:
  contact:
    email: ipb_rifqi@apps.ipb.ac.id
    name: Project Menager
  description: This is a Backend for Agricultural of Distribution for reach transparant,
    decentralization, and immutable.
  termsOfService: http://swagger.io/terms/
  title: Agrichain - Distribution API
  version: "1.0"
paths:
  /auth/access-token:
    post:
      consumes:
      - application/json
      description: This endpoint to get new access token, you must have a valid refresh
        token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseAccessToken'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - BearerAuth: []
      summary: Create new access token.
      tags:
      - Auth
  /auth/delete-account:
    delete:
      consumes:
      - application/json
      description: This endpoint for delete user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - BearerAuth: []
      summary: Delete Account.
      tags:
      - Auth
  /auth/gmail/forgot-password:
    post:
      consumes:
      - js/ @Produce json
      description: This endpoint for user request send link reset password at email.
      parameters:
      - description: query email
        in: query
        name: email
        required: true
        type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      summary: Requset reset password.
      tags:
      - Auth
  /auth/gmail/login:
    post:
      consumes:
      - application/json
      description: This endpoint for user login, get the access and refresh token.
      parameters:
      - description: Login Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseLogin'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      summary: Login user
      tags:
      - Auth
  /auth/gmail/refresh-token:
    post:
      consumes:
      - application/json
      description: This endpoint for get new refresh token, for get new Refresh token
        you must have  a valid refresh token .
      parameters:
      - description: Refresh token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseRefreshToken'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      summary: New Refresh Token.
      tags:
      - Auth
  /auth/gmail/register:
    post:
      consumes:
      - application/json
      description: This endpoint for registery new user.
      parameters:
      - description: Register Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      summary: Register for new user
      tags:
      - Auth
  /auth/gmail/reset-password:
    post:
      consumes:
      - js/ @Produce json
      description: This endpoint for user request send link reset password at email.
      parameters:
      - description: Reset password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UserResetPasswordRequest'
      - description: token
        in: query
        name: token
        required: true
        type: string
      - description: email
        in: query
        name: email
        required: true
        type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      summary: Reset Password.
      tags:
      - Auth
  /auth/gmail/verification:
    get:
      consumes:
      - application/json
      description: This endpoint will send on your email and for validating user.
      parameters:
      - description: Token validasi user
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      summary: Validation User.
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: This endpoint for Logout.
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - BearerAuth: []
      summary: Logout.
      tags:
      - Auth
  /distribution:
    get:
      consumes:
      - application/json
      description: This endpoint for get distributions by distributor id.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.GetDistribution'
            type: array
        "204":
          description: No Content
          schema:
            items:
              $ref: '#/definitions/dto.GetDistribution'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - BearerAuth: []
      summary: Get distributions by distributor id.
      tags:
      - Distributor
  /distribution/{distribution}:
    delete:
      consumes:
      - application/json
      description: This endpoint for distributor delete distribution.
      parameters:
      - description: distribution id
        in: path
        name: distribution
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - BearerAuth: []
      summary: Delete Distribution.
      tags:
      - Distributor
    get:
      consumes:
      - application/json
      description: This endpoint for get detail information of distribution.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GetHarvestById'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - BearerAuth: []
      summary: Get distribution by id.
      tags:
      - Distributor
    patch:
      consumes:
      - application/json
      description: This endpoint for distributor  update distribution.
      parameters:
      - description: distribution id
        in: path
        name: distribution
        required: true
        type: integer
      - description: request body update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateDistributionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - BearerAuth: []
      summary: Update Distributions.
      tags:
      - Distributor
  /distribution/{distribution}/status:
    patch:
      consumes:
      - application/json
      description: This endpoint for update Status Distribution.
      parameters:
      - description: distribution cart id
        in: path
        name: distribution
        required: true
        type: integer
      - description: body request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateStatusDistributionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - BearerAuth: []
      summary: Update Status distribution.
      tags:
      - Distributor
  /distribution/farmer/{farmerprofile}/harvest/{harvest}:
    patch:
      consumes:
      - application/json
      description: This endpoint for distributor create distribution.
      parameters:
      - description: harvest id
        in: path
        name: harvest
        required: true
        type: integer
      - description: farmer profile id
        in: path
        name: farmerprofile
        required: true
        type: integer
      - description: request body create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateDistributionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - BearerAuth: []
      summary: Create Distributions.
      tags:
      - Distributor
  /distribution/retailer-cart/{retailerCart}:
    patch:
      consumes:
      - application/json
      description: This endpoint for distributor approve retailer cart.
      parameters:
      - description: retailer cart id
        in: path
        name: retailerCart
        required: true
        type: integer
      - description: body request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ApprovedRetailerCart'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - BearerAuth: []
      summary: Approved retailer cart.
      tags:
      - Distributor
  /distribution/search:
    get:
      consumes:
      - application/json
      description: This endpoint for get FYP distributions.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.GetDistribution'
            type: array
        "204":
          description: No Content
          schema:
            items:
              $ref: '#/definitions/dto.GetDistribution'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - BearerAuth: []
      summary: Get FYP Distributions.
      tags:
      - Distributor
  /farm/distribution/{distribution}:
    patch:
      consumes:
      - application/json
      description: This endpoint for farmer accept the distribution, the distribution
        cant proceed  to next step if farmer not yet accept it.
      parameters:
      - description: distribution id
        in: path
        name: distribution
        required: true
        type: integer
      - description: request body accept
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AcceptFarmerForDistributor'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - BearerAuth: []
      summary: Accepted distribution for distributor.
      tags:
      - Farmer
  /farm/fyp:
    get:
      consumes:
      - application/json
      description: This endpoint for get FYP harvest.
      produces:
      - application/json
      responses:
        "200":
          description: OK
